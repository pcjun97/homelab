- name: Check for the Tailscale operator OAuth secret
  ansible.builtin.command: kubectl -n tailscale get secret operator-oauth
  register: cluster_bootstrap_ts_secret
  changed_when: false
  failed_when: false

- name: Create the Tailscale operator OAuth secret
  when: cluster_bootstrap_ts_secret.rc != 0
  block:
    - name: Prompt for the OAuth client ID
      ansible.builtin.pause:
        prompt: Tailscale OAuth client ID
      register: cluster_bootstrap_ts_client_id

    - name: Prompt for the OAuth client secret
      ansible.builtin.pause:
        prompt: Tailscale OAuth client secret (hidden)
        echo: false
      register: cluster_bootstrap_ts_client_secret
      no_log: true

    - name: Apply the tailscale namespace and secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tailscale
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: operator-oauth
            namespace: tailscale
          stringData:
            client_id: {{ cluster_bootstrap_ts_client_id.user_input | to_json }}
            client_secret: {{ cluster_bootstrap_ts_client_secret.user_input | to_json }}
      changed_when: true
      no_log: true
