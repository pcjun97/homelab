- name: Check for the backup secret
  ansible.builtin.command: kubectl -n backup get secret backup
  register: cluster_bootstrap_backup_secret
  changed_when: false
  failed_when: false

- name: Create the backup secret
  when: cluster_bootstrap_backup_secret.rc != 0
  block:
    - name: Prompt for the B2 application key ID
      ansible.builtin.pause:
        prompt: B2 application key ID
      register: cluster_bootstrap_b2_key_id

    - name: Prompt for the B2 application key
      ansible.builtin.pause:
        prompt: B2 application key (hidden)
        echo: false
      register: cluster_bootstrap_b2_app_key
      no_log: true

    - name: Prompt for the B2 bucket name
      ansible.builtin.pause:
        prompt: B2 bucket name
      register: cluster_bootstrap_b2_bucket

    - name: Prompt for the ntfy topic
      ansible.builtin.pause:
        prompt: ntfy topic (hidden)
        echo: false
      register: cluster_bootstrap_backup_ntfy_topic
      no_log: true

    # Rendered in memory and passed on stdin, so the secret is never written to disk.
    - name: Apply the backup namespace and secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'backup-secret.yaml.j2') }}"
      changed_when: true
      no_log: true
