# Checks for the newest key, so a secret from an older version of this playbook is recreated.
- name: Check for the backup secret
  ansible.builtin.command: kubectl -n backup get secret backup -o jsonpath={.data.healthchecks_url}
  register: cluster_bootstrap_backup_secret
  changed_when: false
  failed_when: false

- name: Create the backup secret
  when: cluster_bootstrap_backup_secret.stdout == ""
  block:
    - name: Prompt for the B2 application key ID
      ansible.builtin.pause:
        prompt: B2 application key ID
      register: cluster_bootstrap_b2_key_id

    - name: Prompt for the B2 application key
      ansible.builtin.pause:
        prompt: B2 application key (hidden)
        echo: false
      register: cluster_bootstrap_b2_app_key
      no_log: true

    - name: Prompt for the B2 bucket name
      ansible.builtin.pause:
        prompt: B2 bucket name
      register: cluster_bootstrap_b2_bucket

    - name: Prompt for the healthchecks.io ping URL of the backup check
      ansible.builtin.pause:
        prompt: healthchecks.io ping URL for the backup check (hidden)
        echo: false
      register: cluster_bootstrap_backup_healthchecks_url
      no_log: true

    # Applying over an older secret would keep its removed keys
    - name: Delete an older backup secret
      ansible.builtin.command: kubectl -n backup delete secret backup --ignore-not-found
      changed_when: true

    # Rendered in memory and passed on stdin, so the secret is never written to disk.
    - name: Apply the backup namespace and secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'backup-secret.yaml.j2') }}"
      changed_when: true
      no_log: true
