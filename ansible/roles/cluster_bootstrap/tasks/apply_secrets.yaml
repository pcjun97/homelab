# Applied on every run from the secrets file, so changing a value only needs a re-run. Rendered in memory and passed on
# stdin, so the secrets are never written to disk. They use data rather than stringData so that apply removes dropped keys.
- name: Apply the secrets
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.template', item + '.yaml.j2') }}"
  loop:
    - operator-oauth
    - backup-secret
    - cloudflare-api-token
  register: cluster_bootstrap_secret_apply
  # Changed unless kubectl reports both the namespace and the secret as unchanged
  changed_when: cluster_bootstrap_secret_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0
  no_log: true
