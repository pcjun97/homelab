# B2 credentials and bucket are kept on the host only.
backup_rclone_config: /etc/rclone/rclone.conf
backup_env: /etc/homelab/backup.env
backup_schedule: "*-*-* 03:00:00"
# Upload cap, in bytes per second (rclone syntax); 20M is about 160 Mbit/s.
backup_bwlimit: 20M
# Fail the run instead of deleting more remote files than this in one sync.
backup_max_delete: 500
# Must be mounted, or the run stops: an unmounted disk would look like everything was deleted.
backup_required_mounts:
  - /mnt/fast
  - /mnt/bulk
# SQLite databases under this path are snapshotted with sqlite3 .backup before upload.
backup_sqlite_root: /mnt/fast/k8s
backup_sqlite_staging: /var/backups/homelab-sqlite
backup_sources:
  - name: config
    path: /mnt/fast/k8s
    excludes:
      # Live SQLite files; consistent snapshots are uploaded separately
      - "*.db"
      - "*.db-wal"
      - "*.db-shm"
      - "*.sqlite"
      - "*.sqlite-wal"
      - "*.sqlite-shm"
      - "*-journal"
  - name: media
    path: /mnt/bulk/media
    excludes:
      - downloads/incomplete/**
