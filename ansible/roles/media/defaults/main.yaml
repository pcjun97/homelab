# Disk that must be mounted before creating folders, so they never land on the root filesystem.
media_mount: /mnt/bulk
# Mounted into jellyfin and qbittorrent as a hostPath volume (type Directory, so it must exist before they start).
media_root: /mnt/bulk/media
media_folders:
  - movies
  - movies-jp
  - tv
  - tv-jp
  - anime
  - downloads
  - downloads/incomplete
