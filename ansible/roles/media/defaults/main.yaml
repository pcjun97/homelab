# Disk that must be mounted before creating folders, so they never land on the root filesystem.
media_mount: /mnt/bulk
# Folder of the default/media PVC, created by local-path-provisioner with pathPattern <namespace>/<pvc>/.
# Creating it here first is safe: the provisioner reuses an existing folder.
media_root: /mnt/bulk/k8s/default/media
media_folders:
  - movies
  - movies-jp
  - tv
  - tv-jp
  - anime
  - downloads
  - downloads/incomplete
