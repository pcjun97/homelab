- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present

- name: Create /etc/homelab
  ansible.builtin.file:
    path: /etc/homelab
    state: directory
    mode: "0700"

- name: Write the ntfy topic and heartbeat ping URL
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ item.dest }}"
    mode: "0600"
  loop:
    - {dest: "{{ alerts_ntfy_env }}", content: "NTFY_TOPIC={{ secrets_values.ntfy_topic | quote }}"}
    - {dest: "{{ alerts_heartbeat_env }}", content: "HEARTBEAT_URL={{ secrets_values.healthchecks_heartbeat_url | quote }}"}
  no_log: true

- name: Install the notification scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  loop:
    - homelab-notify
    - homelab-diskspace

- name: Install the failure and smartd hooks
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  loop:
    - homelab-unit-failed
    - smartd-ntfy

- name: Install the systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-notify-failure@.service
    - homelab-diskspace.service
  notify: Reload systemd

- name: Install the templated systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-diskspace.timer
    - homelab-heartbeat.service
    - homelab-heartbeat.timer
  notify: Reload systemd

- name: Reload systemd before enabling timers
  ansible.builtin.meta: flush_handlers

- name: Enable the timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - homelab-diskspace.timer
    - homelab-heartbeat.timer
