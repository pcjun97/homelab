- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Install k3s
  when: k3s_version not in k3s_installed.stdout | default('')
  block:
    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/share/k3s-install.sh
        mode: "0755"

    - name: Run k3s install script
      ansible.builtin.command: /usr/local/share/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      changed_when: true

- name: Create storage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ k3s_storage_paths }}"

- name: Wait for k3s to write its kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml

- name: Create kubeconfig directory
  ansible.builtin.file:
    path: "/home/{{ homelab_user }}/.kube"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0700"

- name: Copy kubeconfig for {{ homelab_user }}
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ homelab_user }}/.kube/config"
    remote_src: true
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0600"
