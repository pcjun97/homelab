# Secret values live in one file on the machine running Ansible, outside git. Each playbook lists the keys it needs in
# secrets_required; missing ones are prompted for and saved, so each value is typed once per machine.
secrets_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/homelab/secrets.yaml"
secrets_required: []
# Prompt text per key; hidden keys aren't echoed.
secrets_prompts:
  tailscale_client_id: {prompt: Tailscale OAuth client ID, hidden: false}
  tailscale_client_secret: {prompt: Tailscale OAuth client secret, hidden: true}
  b2_key_id: {prompt: B2 application key ID, hidden: false}
  b2_application_key: {prompt: B2 application key, hidden: true}
  b2_bucket: {prompt: B2 bucket name, hidden: false}
  ntfy_topic: {prompt: ntfy topic, hidden: true}
  healthchecks_backup_url: {prompt: healthchecks.io ping URL for the backup check, hidden: true}
  healthchecks_heartbeat_url: {prompt: healthchecks.io ping URL for the heartbeat check, hidden: true}
