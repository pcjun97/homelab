# Runs on the machine running Ansible as the user, whatever the play's host and become settings.
- name: Read the secrets file
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Check for the secrets file
      ansible.builtin.stat:
        path: "{{ secrets_file }}"
      register: secrets_file_stat

    - name: Load the secrets file
      ansible.builtin.set_fact:
        secrets_values: "{{ (lookup('ansible.builtin.file', secrets_file) | from_yaml or {}) if secrets_file_stat.stat.exists else {} }}"
      no_log: true

    - name: Prompt for missing secrets
      ansible.builtin.pause:
        prompt: "{{ secrets_prompts[item].prompt }}{{ ' (hidden)' if secrets_prompts[item].hidden else '' }}"
        echo: "{{ not secrets_prompts[item].hidden }}"
      loop: "{{ secrets_required | difference(secrets_values.keys()) }}"
      register: secrets_prompted
      no_log: true

    - name: Save the prompted secrets
      when: secrets_prompted.results | length > 0
      block:
        - name: Add the prompted secrets
          ansible.builtin.set_fact:
            secrets_values: >-
              {{ secrets_values | combine(dict(secrets_prompted.results | map(attribute='item')
                 | zip(secrets_prompted.results | map(attribute='user_input') | map('trim')))) }}
          no_log: true

        - name: Create the secrets directory
          ansible.builtin.file:
            path: "{{ secrets_file | dirname }}"
            state: directory
            mode: "0700"

        - name: Write the secrets file
          ansible.builtin.copy:
            content: "{{ secrets_values | to_nice_yaml }}"
            dest: "{{ secrets_file }}"
            mode: "0600"
          no_log: true
