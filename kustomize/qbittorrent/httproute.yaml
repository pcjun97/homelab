# https://qbittorrent.chijun.website through Traefik (tailnet only); the Tailscale Ingress stays as a fallback.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - qbittorrent.chijun.website
  rules:
    - backendRefs:
        - name: qbittorrent
          port: 80
