apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/pcjun97/homelab
        revision: HEAD
        directories:
          - path: kustomize/*
  template:
    metadata:
      name: "{{ .path.basename }}"
      annotations:
        # Compare with a server-side apply dry run, matching ServerSideApply below. The default client-side diff compares
        # arrays in custom resources as a whole, so fields defaulted by a CRD (e.g. Gateway API refs) show as OutOfSync.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      source:
        repoURL: https://github.com/pcjun97/homelab
        targetRevision: HEAD
        path: "{{ .path.path }}"
      destination:
        name: in-cluster
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
