# One wildcard certificate for every app, used by the Gateway's HTTPS listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-chijun-website
spec:
  secretName: wildcard-chijun-website
  dnsNames:
    - "*.chijun.website"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
