apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 42.2.0
    releaseName: traefik
    namespace: traefik
    valuesFile: values.yaml

resources:
  # Gateway API CRDs (standard channel); the version Traefik v3.7 requires
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
  - namespace.yaml
  - certificate.yaml
  - httproute-redirect.yaml
